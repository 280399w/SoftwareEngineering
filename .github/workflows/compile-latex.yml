name: Build LaTeX Documents

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.tex'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.tex'

jobs:
  build_proposal:
    name: Build Proposal PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Proposal LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: proposal/main.tex
          working_directory: proposal
          compiler: lualatex

      - name: Upload Proposal PDF
        uses: actions/upload-artifact@v4
        with:
          name: proposal-pdf
          path: proposal/main.pdf