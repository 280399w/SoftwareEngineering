name: Build LaTeX Documents

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.tex'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.tex'
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build_proposal:
    name: Build Proposal PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Proposal LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: proposal
          compiler: lualatex

      # 1. 確認用にPDFをActionsの画面にアップロードする
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: proposal-pdf
          path: proposal/main.pdf

      # 2. .gitignore を無視して強制的に( -f )コミットする
      - name: Commit and Push PDF to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: 自動生成された proposal/main.pdf を更新"
          file_pattern: "proposal/main.pdf"
          add_options: '-f'