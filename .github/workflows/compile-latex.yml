name: Build LaTeX Documents

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_pdfs:
    name: Compile and Push PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main into pdf branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout pdf
          git merge main

      - name: Compile Proposal
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: proposal
          compiler: latexmk

      - name: Compile External Design
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: external-design
          compiler: latexmk

      - name: Compile Internal Design
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: internal-design
          compiler: latexmk

      - name: Push PDFs to pdf branch
        run: |
          git add -f proposal/main.pdf external-design/main.pdf internal-design/main.pdf
          git commit -m "docs: LaTeX compilation (auto-generated)" || echo "No changes to commit"
          git push origin pdf